<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        
    </div>

    <button command="show-modal" commandfor="add-book">+</button>
        <dialog id="add-book">
        <form action="" method="get">
            <fieldset>
                <legend>Add a book</legend>

                <div>
                    <label for="book-title">Title</label>
                    <input type="text" name="book-title" id="book-title">
                </div>
                    
                <div>
                    <label for="book-author">Author</label>
                    <input type="text" name="book-author" id="book-author">
                </div>
                
                <div>
                    <label for="book-pages">Pages</label>
                    <input type="text" name="book-pages" id="book-pages">
                </div>
                
                <div>
                    <p>Have you read it?</p>    
                    <label for="have-read">Yes</label>
                    <input type="radio" name="have-read" id="yes">
                    <label for="have-read">No</label>
                    <input type="radio" name="have-read" id="no">
                </div>

                <button type="submit">Submit</button>
            </fieldset>
        </form>
        <button class="close-button" commandfor="add-book" command="close">X</button>
        </dialog>
</dialog>
</body>
</html>
